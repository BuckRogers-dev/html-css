<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascripts</title>
    <link rel="shortcut icon" href="thunder.ico" type="image/x-icon">
    <style>
        body {
            background-color: cadetblue;
        }
    </style>
</head>
<body>
    <a href="#" onclick="clicou()">Clique em mim</a>
    <div id="saída"></div>
    
    <script>
        function clicou() {
            s = window.document.getElementById("saída")
            s.innerHTML += '<p>Você clicou</p>'
        }
    </script>
</body>
</html>
