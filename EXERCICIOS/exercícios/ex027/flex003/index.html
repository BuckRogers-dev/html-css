<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <link rel="shortcut icon" href="thunder.ico" type="image/x-icon">
    <style>
        div.conteiner {
            background-color: lightsalmon;

            display: flex;
            flex-flow: row wrap;
             /* isso também é padrão, mas é um shorthand; o comando flex-flow: row nowrap é uma shorthand, une tudo ok, os 2 comandos ficam unidos: flex-direction: row e ainda o flex-wrap: nowrap*/
        }

        div.item { 
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            flex: auto; /* esso comando é só no filho, também shorthand */
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">Exemplo de bloco A</div>
        <div class="item">Exemplo de bloco B</div>
        <div class="item">Exemplo de bloco C</div>
        <div class="item">Exemplo de bloco D</div>
        <div class="item">Exemplo de bloco E</div>
        <div class="item">Exemplo de bloco F</div>
        <div class="item">Exemplo de bloco G</div>
    </div>
</body>
</html>
