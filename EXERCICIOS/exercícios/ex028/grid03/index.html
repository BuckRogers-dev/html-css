<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na prática</title>
    <link rel="shortcut icon" href="thunder.ico" type="image/x-icon">
    <style>
    div.conteiner {
        border: 3px solid blue;
        height: 250px;
        display: grid;
        /*grid-template-columns: auto auto auto;
        grid-template-rows: auto auto auto; posso deixar simplificado como abaixo nessa shrothand, row primeiro e depois columns */
        grid-template: repeat(3, auto) / repeat(3, auto);
        gap: 10px;
        /*align-items: start;
        justify-items: center; outro shorthand abaixo, align-tems e depois justify-items*/
        place-items: start center;
        /*align-content: space-between;
        justify-content: end; outra shorthand align e depois justify*/
        place-content: space-between end;
    }

    div.item {
        border: 3px solid red;
        padding: 5px;
    }
</style>
</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
    </div>
    
</body>
</html>
